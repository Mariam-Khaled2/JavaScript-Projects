<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="./css/style.css" rel="stylesheet">
</head>
<body>
    <div id="calculator_container">
        <div id="display-area"></div>
        <div class="calculator_row">
            <button>C</button> <!--Delete everything write-->
            <button>(</button>
            <button>)</button>
            <button>/</button>
        </div>
        <div class="calculator_row">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>*</button>
        </div>
        <div class="calculator_row">
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>
        </div>
        <div class="calculator_row">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>
        </div>
        <div class="calculator_row">
            <button>DEL</button> <!-- not delete everything write just any number-->
            <button>0</button>
            <button>.</button>
            <button style="background-color: #807e7e; font-weight:bold; font-size:23px">=</button>
        </div>
    </div>

    <script
  src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.1/math.js">
</script>
    <script src="./main.js"></script>
</body>
</html>
